<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scam Report · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <a href="scam-reports.html" class="btn btn-outline-success d-none d-md-inline-flex align-items-center gap-2 mb-3">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>All Reports</span>
      </a>

      <article class="bg-white border rounded-3 shadow-sm p-4">
        <h1 class="h3 fw-bold mb-3"><span id="query_goes_here">Loading…</span></h1>

        <!-- author: avatar, name and date together -->
        <div class="d-flex align-items-center gap-3 mb-3">
          <img id="ownerAvatar" class="avatar rounded-circle flex-shrink-0" src="images/default-avatar.svg" alt="" width="40" height="40" />
          <div>
            <p class="fw-bold mb-0"><span id="username_goes_here"></span></p>
            <p class="small text-body-secondary mb-0"><span id="date_goes_here"></span></p>
          </div>
        </div>

        <p class="mb-0" style="white-space: pre-wrap"><span id="message_goes_here"></span></p>
        <div id="reportActions" class="d-flex flex-wrap gap-2 mt-3">
          <button id="deleteBtn" type="button" class="btn btn-outline-danger btn-sm d-none">
            Delete report
          </button>
        </div>
      </article>
    </main>

    <bottom-nav></bottom-nav>
    <script type="module" src="/src/scam-query.js"></script>
  </body>
</html>
