<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <div class="text-center mb-4">
        <img src="images/safelink-logo.png" alt="SafeLink" width="280" class="img-fluid" />
        <p class="text-body-secondary mt-2 mb-0">Stay safer online.</p>
      </div>

      <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Login -->
      <section id="loginView" class="bg-white border rounded-3 shadow-sm p-4">
        <h1 class="h3 mb-4 text-center fw-bold">Log In</h1>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" id="loginEmail" class="form-control" autocomplete="email" required />
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-success w-100">Log In</button>
        </form>
        <p class="small mt-3 mb-0 text-center">
          Don’t have an account?
          <a href="#" id="toSignup" class="link-success">Sign up</a>
        </p>
      </section>

      <!-- Signup -->
      <section id="signupView" class="bg-white border rounded-3 shadow-sm p-4 d-none">
        <h1 class="h3 mb-4 text-center fw-bold">Sign Up</h1>
        <form id="signupForm" novalidate>
          <div class="mb-3">
            <label for="signupName" class="form-label">First and last name</label>
            <input type="text" id="signupName" class="form-control" autocomplete="name" required />
          </div>
          <div class="mb-3">
            <label for="signupEmail" class="form-label">Email</label>
            <input type="email" id="signupEmail" class="form-control" autocomplete="email" required />
          </div>
          <div class="mb-3">
            <label for="signupPassword" class="form-label">Password</label>
            <input type="password" id="signupPassword" class="form-control" autocomplete="new-password" minlength="6" required />
            <div class="form-text">At least 6 characters.</div>
          </div>
          <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>
        <p class="small mt-3 mb-0 text-center">
          Already have an account?
          <a href="#" id="toLogin" class="link-success">Log in</a>
        </p>
      </section>
    </main>

    <script type="module" src="/src/login.js"></script>
  </body>
</html>
