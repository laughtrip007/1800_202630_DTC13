<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Link Checker · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <a
        href="features.html"
        class="btn btn-outline-success d-none d-md-inline-flex align-items-center gap-2 mb-3"
      >
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>All Features</span>
      </a>
      <div
        class="card border-0 shadow-sm mb-4 text-center page-header bg-success-subtle rounded-3 d-none d-md-block"
      >
        <div class="card-body py-3">
          <h1 class="h3 fw-bold mb-0 text-success">Link Checker</h1>
        </div>
      </div>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <p class="text-body-secondary text-center">
            Not sure if a link can be trusted? Paste it below and let SafeLink
            help you make a safer decision.
          </p>
          <form id="linkForm" novalidate>
            <label for="linkInput" class="form-label fw-bold"
              >Enter a link</label
            >
            <input
              id="linkInput"
              type="url"
              inputmode="url"
              autocomplete="off"
              class="form-control form-control-lg mb-3"
              placeholder="https://example.com"
            />

            <div class="d-grid">
              <button type="submit" class="btn btn-success btn-lg">
                Analyze Link
              </button>
            </div>
          </form>
          <p class="text-center text-muted small mt-3 mb-0">
            SafeLink uses the Google Safe Browsing API to check links against
            known threats.
          </p>
        </div>
      </section>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 fw-bold text-center mb-1">Recent Link Checks</h2>
          <p class="small text-body-secondary text-center mb-3">
            <span id="linkCheckCounter" class="fw-bold text-success">–</span> checked in total
          </p>
          <div id="linkHistory">
            <p class="text-body-secondary text-center mb-0">Loading…</p>
          </div>
        </div>
      </section>
    </main>

    <bottom-nav></bottom-nav>
    <script type="module" src="/src/link-checker.js"></script>
    <script type="module" src="/src/link-counter.js"></script>
  </body>
</html>
