<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submit a Report · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <a href="scam_reports.html" class="btn btn-outline-success d-inline-flex align-items-center gap-2 mb-3">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>All Reports</span>
      </a>

      <div class="card border-0 shadow-sm mb-4 text-center page-header">
        <div class="card-body py-3">
          <h1 class="h3 fw-bold mb-0">Submit a Scam Report</h1>
        </div>
      </div>

      <section class="card border-0 shadow-sm">
        <div class="card-body">
          <form id="addReportForm" novalidate>
            <div class="mb-3">
              <label for="queryInput" class="form-label fw-semibold">What's wrong?</label>
              <input type="text" id="queryInput" class="form-control" maxlength="120" placeholder="e.g. I lost all my money!" required />
            </div>
            <div class="mb-3">
              <label for="detailsInput" class="form-label fw-semibold">Explain what you found.</label>
              <textarea id="detailsInput" class="form-control" rows="5" placeholder="What happened? Include the link, phone number or message if you have it." required></textarea>
            </div>
            <button id="submitReportBtn" type="submit" class="btn btn-success w-100">Enter report</button>
          </form>
        </div>
      </section>
    </main>

    <bottom-nav></bottom-nav>
    <script type="module" src="/src/submitReport.js"></script>
  </body>
</html>
