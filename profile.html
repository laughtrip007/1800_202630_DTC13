<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <div class="card border-0 shadow-sm mb-4 page-header">
        <div class="card-body d-flex align-items-center gap-3">
          <img class="rounded-circle bg-white" src="images/profile_icon.png" alt="" width="56" height="56" />
          <div class="text-break">
            <h1 id="profileName" class="h4 fw-bold mb-0">Loading…</h1>
            <p id="profileEmail" class="mb-0 opacity-75"></p>
          </div>
        </div>
      </div>

      <section class="card border-0 shadow-sm mb-4">
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between">
            <span class="text-body-secondary">Links checked</span>
            <span id="profileChecks" class="fw-bold text-success">–</span>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span class="text-body-secondary">Member since</span>
            <span id="profileSince" class="fw-semibold"></span>
          </li>
        </ul>
      </section>

      <div class="d-grid">
        <button id="logoutBtn" type="button" class="btn btn-outline-danger btn-lg">Log Out</button>
      </div>
    </main>

    <bottom-nav></bottom-nav>
    <script type="module" src="/src/profile.js"></script>
  </body>
</html>
