<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <div class="card border-0 shadow-sm mb-4 page-header">
        <div class="card-body d-flex align-items-center gap-3">
          <img class="rounded-circle bg-white" src="images/profile_icon.png" alt="" width="56" height="56" />
          <div class="text-break">
            <h1 id="profileName" class="h4 fw-bold mb-0">Loading…</h1>
            <p id="profileEmail" class="mb-0 opacity-75"></p>
            <p class="small mb-0 opacity-75">Member since <span id="profileSince"></span></p>
          </div>
        </div>
      </div>

      <section class="accordion profile-accordion shadow-sm mb-4" id="profileLists">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#checksPanel" aria-expanded="false" aria-controls="checksPanel">
              <i class="bi bi-link-45deg text-success me-2" aria-hidden="true"></i>
              <span class="flex-grow-1">Links Checked</span>
              <span id="checksCount" class="badge rounded-pill text-bg-success me-2">–</span>
            </button>
          </h2>
          <div id="checksPanel" class="accordion-collapse collapse" data-bs-parent="#profileLists">
            <div id="checksList" class="accordion-body profile-list">
              <p class="text-body-secondary mb-0">Loading…</p>
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#reportsPanel" aria-expanded="false" aria-controls="reportsPanel">
              <i class="bi bi-bookmark text-success me-2" aria-hidden="true"></i>
              <span class="flex-grow-1">Saved Scam Reports</span>
              <span id="reportsCount" class="badge rounded-pill text-bg-success me-2">–</span>
            </button>
          </h2>
          <div id="reportsPanel" class="accordion-collapse collapse" data-bs-parent="#profileLists">
            <div id="reportsList" class="accordion-body profile-list">
              <p class="text-body-secondary mb-0">Loading…</p>
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#helpPanel" aria-expanded="false" aria-controls="helpPanel">
              <i class="bi bi-chat-left-text text-success me-2" aria-hidden="true"></i>
              <span class="flex-grow-1">Saved Help Pages</span>
              <span id="helpCount" class="badge rounded-pill text-bg-success me-2">–</span>
            </button>
          </h2>
          <div id="helpPanel" class="accordion-collapse collapse" data-bs-parent="#profileLists">
            <div id="helpList" class="accordion-body profile-list">
              <p class="text-body-secondary mb-0">Loading…</p>
            </div>
          </div>
        </div>
      </section>

      <div class="d-grid">
        <button id="logoutBtn" type="button" class="btn btn-outline-danger btn-lg">Log Out</button>
      </div>
    </main>

    <bottom-nav></bottom-nav>
    <script type="module" src="/src/profile.js"></script>
  </body>
</html>
