<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="/src/site-navbar.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <site-navbar></site-navbar>

    <div class="container py-4">
      <!-- Back Button -->
      <a
        href="index.html"
        class="btn btn-outline-success btn-lg d-inline-flex align-items-center gap-2 mb-4"
      >
        <span class="fs-4">←</span>
        <span>Go Back</span>
      </a>

      <div
        class="card border-0 shadow-sm mb-4 text-center bg-success text-white"
      >
        <h1>Community Help</h1>
      </div>

      <!-- Ask a question -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <h3 class="text-center mb-4 fw-bold">Ask the Community</h3>
          <textarea
            id="questionInput"
            class="form-control form-control-lg"
            rows="4"
            placeholder="Not sure if something is a scam? Ask here."
          ></textarea>
        </div>
      </div>

      <div class="d-grid mb-4">
        <button id="postBtn" class="btn btn-success btn-lg">
          Post Question
        </button>
      </div>

      <!-- List of questions -->
      <h2 class="mb-3">Recent Questions</h2>
      <div id="postList"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar fixed-bottom bg-success bottom-nav">
      <div class="container-fluid justify-content-around text-center">
        <a class="nav-link text-white" href="index.html">
          <div class="text-2xl">⌂</div>
          <small>Home</small>
        </a>
        <a class="nav-link text-white" href="community_help.html">
          <div class="text-2xl">?</div>
          <small>Help</small>
        </a>
        <a class="nav-link text-white" href="#">
          <div class="text-2xl">⌕</div>
          <small>Search</small>
        </a>
      </div>
    </nav>

    <!-- Link to scripts of your own -->
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/communityHelp.js"></script>
  </body>
</html>
