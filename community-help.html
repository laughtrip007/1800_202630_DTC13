<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Help · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <a href="features.html" class="btn btn-outline-success d-none d-md-inline-flex align-items-center gap-2 mb-3">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>All Features</span>
      </a>
      <div class="card border-0 shadow-sm mb-4 text-center page-header bg-success-subtle rounded-3 d-none d-md-block">
        <div class="card-body py-3">
          <h1 class="h3 fw-bold mb-0 text-success">Community Help</h1>
        </div>
      </div>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <form id="postForm" novalidate>
            <label for="questionInput" class="form-label h5 fw-bold d-block text-center mb-3">
              Ask the Community
            </label>
            <textarea
              id="questionInput"
              class="form-control form-control-lg mb-3"
              rows="4"
              placeholder="Not sure if something is a scam? Ask here."
            ></textarea>
            <div class="d-grid">
              <button id="postBtn" type="submit" class="btn btn-success btn-lg">Post Question</button>
            </div>
          </form>
        </div>
      </section>

      <h2 class="h4 fw-bold mb-3">Recent Questions</h2>
      <div id="postList">
        <p class="text-body-secondary text-center">Loading…</p>
      </div>
    </main>

    <!-- Full comment section: fullscreen on phones, like opening a post on X -->
    <div class="modal fade" id="commentModal" tabindex="-1" aria-labelledby="commentModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <button type="button" class="btn btn-link text-body p-0 me-3 fs-4 lh-1" data-bs-dismiss="modal" aria-label="Back">
              <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </button>
            <h2 id="commentModalTitle" class="modal-title h5 fw-bold">Post</h2>
          </div>

          <div class="modal-body">
            <div id="commentPost" class="pb-3 mb-3 border-bottom"></div>
            <h3 id="commentCount" class="h6 fw-bold mb-3">Comments</h3>
            <div id="commentList"></div>
          </div>

          <div class="modal-footer d-block">
            <div class="d-flex gap-2 align-items-end">
              <textarea
                id="commentInput"
                class="form-control"
                rows="2"
                placeholder="Write a comment..."
                aria-label="Write a comment"
              ></textarea>
              <button id="commentBtn" type="button" class="btn btn-success">Reply</button>
            </div>
          </div>
        </div>
      </div>
    </div>
     
    <bottom-nav></bottom-nav>
    <script type="module" src="/src/community-help.js"></script>
  </body>
</html>
