<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scam Reports · SafeLink</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="bg-body-tertiary" hidden>
    <site-navbar></site-navbar>

    <main class="container page py-4">
      <a href="features.html" class="btn btn-outline-success d-none d-md-inline-flex align-items-center gap-2 mb-3">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>All Features</span>
      </a>
      <div class="card mb-4 text-center page-header bg-success-subtle rounded-3 d-none d-md-block">
        <div class="card-body py-3">
          <h1 class="h3 fw-bold mb-0 text-success">Scam Reports</h1>
        </div>
      </div>

      <!-- shortcut to the report form. Not on phones: the + in the phone header does the same -->
      <section class="card border-0 shadow-sm mb-4 d-none d-md-block">
        <div class="card-body text-center">
          <h2 class="h5 fw-bold mb-1">Seen a Scam?</h2>
          <p class="text-body-secondary mb-3">Report it so others can stay safe.</p>
          <div class="d-grid">
            <a href="submit-report.html" class="btn btn-success btn-lg d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              <span>Submit a Report</span>
            </a>
          </div>
        </div>
      </section>

      <input
        id="searchInput"
        type="search"
        class="form-control form-control-lg mb-3"
        placeholder="Search reports by keyword..."
      />
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="small fw-semibold text-body-secondary">Sort</span>
        <div id="sortOptions" class="btn-group btn-group-sm sort-options" role="group" aria-label="Sort reports">
          <input type="radio" class="btn-check" name="sort" id="sortNewest" value="newest" checked />
          <label class="btn btn-outline-success" for="sortNewest">Newest</label>
          <input type="radio" class="btn-check" name="sort" id="sortOldest" value="oldest" />
          <label class="btn btn-outline-success" for="sortOldest">Oldest</label>
          <input type="radio" class="btn-check" name="sort" id="sortSeen" value="seen" />
          <label class="btn btn-outline-success" for="sortSeen">
            <i class="bi bi-people-fill" aria-hidden="true"></i> Most seen
          </label>
        </div>
      </div>
      <div id="reportList">
        <p class="text-body-secondary text-center">Loading…</p>
      </div>
    </main>

    <bottom-nav></bottom-nav>
    <script type="module" src="/src/scam-reports.js"></script>
  </body>
</html>
